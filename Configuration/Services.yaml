services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  BrainAppeal\T3monitor\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/Exception/*'
      - '../Classes/**/Exception.php'

  BrainAppeal\T3monitor\Service\DataCollector:
    public: true

  BrainAppeal\T3monitor\Service\DataResponseHandler:
    public: true

  BrainAppeal\T3monitor\CoreApi\CoreApiFactory:
    public: true

  BrainAppeal\T3monitor\CoreApi\TYPO3Version13\CoreApi:
    public: true
    calls:
      - setPageInformationFactory: ['@?TYPO3\CMS\Frontend\Page\PageInformationFactory']
      - setFrontendTypoScriptFactory: ['@?TYPO3\CMS\Core\TypoScript\FrontendTypoScriptFactory']

  BrainAppeal\T3monitor\CoreApi\TYPO3Version14\CoreApi:
    public: true
    calls:
      - setPageInformationFactory: ['@?TYPO3\CMS\Frontend\Page\PageInformationFactory']
      - setFrontendTypoScriptFactory: ['@?TYPO3\CMS\Core\TypoScript\FrontendTypoScriptFactory']

  BrainAppeal\T3monitor\Registry\StatusRegistry:
    public: true
    calls:
        - setRegistry: ['@?TYPO3\CMS\Reports\Registry\StatusRegistry']
